<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha · Synapse Logic</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d19;color:#eef2ff;font:16px system-ui;padding:24px}.card{width:min(100%,460px);background:#121c2e;padding:32px;border:1px solid #334155;border-radius:22px;box-shadow:0 20px 60px #0005}h1{margin:0 0 8px;font-size:28px}p{color:#aab6ca;line-height:1.5}label{display:block;margin:18px 0 8px;font-weight:600}input{width:100%;padding:14px;border:1px solid #334155;border-radius:12px;background:#091222;color:#fff;font:inherit}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:linear-gradient(100deg,#8b5cf6,#6476e8);color:white;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#message{min-height:24px;margin-top:16px;overflow-wrap:anywhere;color:#fca5a5}
  </style>
</head>
<body>
  <main class="card">
    <h1>Crie uma nova senha</h1>
    <p>Use pelo menos 10 caracteres. Depois, volte ao login da Synapse Logic.</p>
    <form id="resetForm">
      <label for="newPassword">Nova senha</label>
      <input id="newPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required placeholder="Mínimo de 10 caracteres">
      <label for="confirmPassword">Confirme a nova senha</label>
      <input id="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required placeholder="Digite novamente" />
      <button id="resetButton" type="submit">Salvar senha</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="/redefinir-senha.js" defer></script>
</body>
</html>
